# Optional: build and push the image with Cloud Build instead of a workstation.
# Useful because the build downloads ~5 GB and the push uploads ~5 GB; inside Google's
# network both are faster, and Cloud Shell's disk is too small for the build.
#
#   gcloud builds submit --config gcp/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_AR_REPO=gemma,_IMAGE=gemma-e2b-server,_TAG=$(date -u +%Y%m%d)-$(git rev-parse --short=12 HEAD) .
#
# The pushed digest is printed at the end of the build log and stored as a build result.
# Artifact Analysis scans the image on push if containerscanning.googleapis.com is on.
substitutions:
  _REGION: us-central1
  _AR_REPO: gemma
  _IMAGE: gemma-e2b-server
  _TAG: manual

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - --platform=linux/amd64
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:${_TAG}

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
