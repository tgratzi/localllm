name: Release TOS package

# Builds the Gemma server image, packages it with tupack into one .tar that
# `tos apps install` takes, and publishes it as a GitHub Release.
#
# Trigger: push a tag such as v1.2.0, or run it by hand with a version.
#
# Needs one repository secret:
#   BASEIMAGE_TOKEN  a token that can read tufin-ext-resources/baseimage7 (Contents: read).
#                    tupack is only distributed in that private repo.
#
# GitHub limits each release file to 2 GiB and the package is ~5 GB, so the .tar is
# uploaded in parts. The release notes show how to join them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.2.0 (a tag with this name is created)'
        required: true

permissions:
  contents: write   # create the release and upload its files

concurrency:
  group: release-tupack-${{ github.ref }}
  cancel-in-progress: false

env:
  # tupack comes from this tag of baseimage7; the SHA-256 guards against it changing.
  BASEIMAGE_REF: v0.5.5
  TUPACK_SHA256: 840e9de158e25975478aadec20bcc165bb98c49f5e4ce8b11b47be86cb82ab7f
  PART_SIZE: 1900M

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_VERSION:-$REF_NAME}"
          [[ "$tag" == v* ]] || tag="v${tag}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a version tag such as v1.2.0"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The build needs ~25 GB at its peak (image, build cache, registry copy, tupack cache,
      # output). A stock runner has less free, so drop toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v5

      - name: Fetch tupack
        uses: actions/checkout@v5
        with:
          repository: tufin-ext-resources/baseimage7
          ref: ${{ env.BASEIMAGE_REF }}
          token: ${{ secrets.BASEIMAGE_TOKEN }}
          path: .baseimage
          sparse-checkout: src/scripts/tupack
          sparse-checkout-cone-mode: false

      - name: Build image
        run: scripts/build-image.sh

      - name: Drop build cache
        # The model download stage alone is ~5 GB; the finished image is kept.
        run: docker builder prune -af >/dev/null && df -h /

      - name: Package with tupack
        env:
          TUPACK: ${{ github.workspace }}/.baseimage/src/scripts/tupack
        run: scripts/build-tupack.sh "${{ steps.ver.outputs.version }}"

      - name: Split into parts under the 2 GiB release-file limit
        id: split
        working-directory: dist
        run: |
          tar_name="localllm-${{ steps.ver.outputs.version }}.tar"
          split -b "$PART_SIZE" -d -a 2 "$tar_name" "${tar_name}.part-"
          rm -f "$tar_name"
          ls -l
          echo "tar_name=$tar_name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(awk '{print $1}' "${tar_name}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: localllm ${{ steps.ver.outputs.tag }}
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.split.outputs.tar_name }}.part-*
            dist/${{ steps.split.outputs.tar_name }}.sha256
          body: |
            Gemma 4 E2B (llama.cpp `llama-server`, CPU only) packaged for TOS with tupack.

            **Install on the TOS node**

            ```bash
            # download every part and the .sha256 into one directory, then:
            cat ${{ steps.split.outputs.tar_name }}.part-* > ${{ steps.split.outputs.tar_name }}
            sha256sum -c ${{ steps.split.outputs.tar_name }}.sha256
            tos apps install ${{ steps.split.outputs.tar_name }}      # first install
            tos apps upgrade ${{ steps.split.outputs.tar_name }}      # later versions
            ```

            Apps in the cluster call `http://localllm:8080/v1` with the key from Secret
            `localllm-api-key`. See `docs/kubernetes.md`.

            SHA-256 of the joined `.tar`: `${{ steps.split.outputs.sha256 }}`
