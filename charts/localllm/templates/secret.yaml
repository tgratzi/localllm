{{- if not .Values.apiKey.existingSecret }}
{{- $name := include "localllm.secretName" . }}
{{- /* Reuse the key already in the cluster so upgrades don't break callers. lookup returns
       nothing when Helm only renders templates (no cluster), and then a new key is made. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- /* Nested ifs, not "and": the Helm in tupack doesn't short-circuit "and", so index on nil fails. */}}
{{- $key := "" }}
{{- if $existing }}
{{- if $existing.data }}
{{- $key = index $existing.data "api_key" | default "" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
    name: {{ $name }}
    labels:
        {{- include "localllm.labels" . | nindent 8 }}
type: Opaque
data:
    {{- if $key }}
    api_key: {{ $key }}
    {{- else }}
    api_key: {{ randAlphaNum 48 | b64enc }}
    {{- end }}
{{- end }}
