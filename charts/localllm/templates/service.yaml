apiVersion: v1
kind: Service
metadata:
    name: {{ include "localllm.name" . }}
    labels:
        {{- include "localllm.labels" . | nindent 8 }}
spec:
    # ClusterIP only: reachable from pods in the cluster, never from outside it.
    type: ClusterIP
    selector:
        app: {{ include "localllm.name" . }}
    ports:
        -   name: http
            port: {{ .Values.service.port }}
            targetPort: http
